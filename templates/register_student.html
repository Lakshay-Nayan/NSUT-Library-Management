{% extends "base.html" %}
{% block title %}Register Student{% endblock %}
{% block content %}
<h2>Register Student</h2>
<p>Enter the student's college roll number. Study year are extracted automatically.</p>
<form method="POST" class="form-box">
    <label>College Roll Number</label>
    <input name="roll_no" placeholder="2026UCA1800" required>
    <label>Student Name</label><input name="name" required>
    <label>Email</label><input type="email" name="email">
    <label>Phone Number</label><input name="phone">
    <button type="submit">Register Student</button>
</form>
{% endblock %}
